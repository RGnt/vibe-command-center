version: '3.8'

services:
  db:
    build:
      context: ../database
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: todo_test_user
      POSTGRES_PASSWORD: todo_test_password
      POSTGRES_DB: todo_test_db
    # Not mounting volumes to ensure fresh DB

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://todo_test_user:todo_test_password@db:5432/todo_test_db?sslmode=disable
      - JWT_SECRET=test_jwt_secret
    depends_on:
      - db
    restart: on-failure

  backend-test:
    build:
      context: ../backend
      dockerfile: Dockerfile.test
    environment:
      - DATABASE_URL=postgres://todo_test_user:todo_test_password@db:5432/todo_test_db?sslmode=disable
      - JWT_SECRET=test_jwt_secret
    depends_on:
      - db
    profiles:
      - test

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "8089:80"
    depends_on:
      - backend
    restart: on-failure

  agent-harness:
    build:
      context: ../agent-harness
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://backend:8080/api
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8091/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-Gemma4}
      - MAX_TURNS=${MAX_TURNS:-25}
    depends_on:
      - backend
    restart: on-failure
