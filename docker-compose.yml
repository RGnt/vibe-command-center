version: '3.8'

services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_password}
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-todo_user}:${POSTGRES_PASSWORD:-todo_password}@db:5432/${POSTGRES_DB:-todo_db}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - BCRYPT_COST=${BCRYPT_COST:-12}
      - IS_HTTPS=${IS_HTTPS:-false}
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/storage:/app/storage
    depends_on:
      - db
    # Note: Not exposing ports to the host. Only accessible within the Docker network via the frontend proxy.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  agent-harness:
    build:
      context: ./agent-harness
      dockerfile: Dockerfile
    ports:
      - "${AGENT_HARNESS_PORT:-8001}:8000"
    volumes:
      - ./:/app/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - BACKEND_URL=http://backend:8080/api
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8091/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-Gemma4}
      - MAX_TURNS=${MAX_TURNS:-25}
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
