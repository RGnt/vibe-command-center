openapi: 3.0.0
info:
  title: Todo Application API
  version: 1.0.0
  description: API for managing todos and customizable workflows.
servers:
  - url: http://localhost:8080/api
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
        '409':
          description: Email already exists

  /auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      summary: Get current authenticated user
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Returns current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
  /todos:
    get:
      summary: Get all top-level todos
      responses:
        '200':
          description: A list of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      summary: Create a new todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '201':
          description: The created todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
  /todos/{id}:
    get:
      summary: Get a specific todo by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The todo object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found
    put:
      summary: Update a todo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '200':
          description: The updated todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
    delete:
      summary: Delete a todo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Todo deleted successfully
  /todos/{id}/toggle:
    patch:
      summary: Toggle completion status of a todo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The updated todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
  /todos/{parent_id}/subtasks:
    post:
      summary: Create a subtask under a specific todo
      parameters:
        - in: path
          name: parent_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '201':
          description: The created subtask
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
  /todos/stage:
    get:
      summary: Get all todos grouped by workflow stage
      responses:
        '200':
          description: Todos grouped by stage
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    todos:
                      type: array
                      items:
                        $ref: '#/components/schemas/Todo'
  /workflows:
    get:
      summary: Get all workflows
      responses:
        '200':
          description: A list of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
    post:
      summary: Create a new workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowInput'
      responses:
        '201':
          description: The created workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
  /workflows/{id}:
    put:
      summary: Update a workflow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowInput'
      responses:
        '200':
          description: The updated workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
    delete:
      summary: Delete a workflow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Workflow deleted successfully

  /wikis:
    get:
      summary: Get all wiki pages
      parameters:
        - in: query
          name: project_id
          schema:
            type: integer
      responses:
        '200':
          description: A list of wiki pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WikiPage'
    post:
      summary: Create a new wiki page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WikiPageInput'
      responses:
        '201':
          description: Created wiki page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
  /wikis/{slug}:
    get:
      summary: Get a specific wiki page by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The wiki page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
    put:
      summary: Update a wiki page
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WikiPageInput'
      responses:
        '200':
          description: Updated wiki page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
    delete:
      summary: Delete a wiki page
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted successfully

  /diagrams:
    get:
      summary: Get all diagrams
      responses:
        '200':
          description: A list of diagrams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Diagram'
    post:
      summary: Create a new diagram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagramInput'
      responses:
        '201':
          description: Created diagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagram'

  /diagrams/{id}:
    get:
      summary: Get a diagram by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The diagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagram'
    put:
      summary: Update a diagram
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagramInput'
      responses:
        '200':
          description: Updated diagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagram'
    delete:
      summary: Delete a diagram
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted successfully

  /icons:
    get:
      summary: Get all custom icons
      responses:
        '200':
          description: A list of custom icons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Icon'
  /icons/{id}:
    put:
      summary: Update an icon's name or folder
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IconUpdateInput'
      responses:
        '200':
          description: Updated icon
    delete:
      summary: Delete an icon
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted successfully

  /upload:
    post:
      summary: Upload a new icon image
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        created_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    TodoInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        content:
          type: string
        completed:
          type: boolean
          default: false
        stage:
          type: string
          default: 'To Do'
    Todo:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        completed:
          type: boolean
        created_at:
          type: string
          format: date-time
        parent_id:
          type: integer
        stage:
          type: string
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
    WorkflowStageInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    WorkflowStage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        order:
          type: integer
    WorkflowInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStageInput'
    Workflow:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        stages:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStage'

    WikiPageInput:
      type: object
      required:
        - title
        - slug
      properties:
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        category:
          type: string
        project_id:
          type: integer

    WikiPage:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        category:
          type: string
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DiagramInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        diagram_type:
          type: string
        code:
          type: string
        explanation:
          type: string

    Diagram:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        diagram_type:
          type: string
        code:
          type: string
        explanation:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IconUpdateInput:
      type: object
      properties:
        name:
          type: string
        folder:
          type: string

    Icon:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        folder:
          type: string
        created_at:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
